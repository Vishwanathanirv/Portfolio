<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lost knight · Vishwanathan R</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..600&family=Geist+Mono:wght@400&display=swap">
<style>
:root{--bg:#F8F7F4;--ink:#141619;--muted:#6E7278;--faint:#A9ACB1;--line:#E8E6E1;
  --blush:#EDDDD6;--sand:#EFE6D3;--sage:#DFE7D8;--mist:#DCE4EC;--lilac:#E4E0EC;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);display:grid;place-items:center;padding:32px 16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blush),var(--sand),var(--sage),var(--mist),var(--lilac))}
main{text-align:center;max-width:440px}
.b{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);margin:0 auto 34px;border-radius:9px;overflow:hidden;box-shadow:0 0 0 1px var(--line);width:max-content}
.b i{background:#F1EFEA}.b i:nth-child(even){background:#E7E4DD}
.b i.k{display:grid;place-items:center;font-style:normal;font-size:22px;background:var(--sand);font-family:"Segoe UI Symbol","Apple Symbols","DejaVu Sans",serif;animation:hop 2.4s ease-in-out infinite}
@keyframes hop{0%,100%{transform:none}50%{transform:translateY(-3px)}}
.code{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
h1{margin:10px 0 12px;font-size:clamp(1.8rem,6vw,2.4rem);font-weight:400;letter-spacing:-.045em;line-height:1.15}
p{margin:0 0 28px;color:var(--muted);font-weight:300;font-size:16px;line-height:1.6}
a{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);text-decoration:none;border:1px solid var(--ink);border-radius:999px;padding:9px 18px;transition:background .2s,color .2s}
a:hover,a:focus-visible{background:var(--ink);color:var(--bg);outline:none}
@media (prefers-reduced-motion:reduce){.b i.k{animation:none}}
</style>
</head>
<body>
<main>
  <div class="b" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="k">♞&#xFE0E;</i></div>
  <div class="code">404 · page not found</div>
  <h1>This page wandered off<br>like a lost knight.</h1>
  <p>Knights only move in L-shapes, and this one took a wrong turn. Let's get you back to the board.</p>
  <a href="/">Back to vishwanathan.dev</a>
</main>
</body>
</html>
